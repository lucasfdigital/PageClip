name: Release

# Publica a release no GitHub com o .zip da extensão anexado. Dois jeitos:
# - enviar uma tag de versão (git push origin v1.1.0): o texto vem da mensagem
#   da tag anotada (git tag -a v1.1.0 -m "...");
# - botão "Run workflow" em Actions, na main: cria a tag v<versão do
#   manifest.json> no commit atual e usa o texto digitado.
# Se a release já existir (criada à mão pelo site), só anexa o .zip.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: Texto da release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versão e texto
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::A tag é $GITHUB_REF_NAME, mas o manifest.json diz $version."
              exit 1
            fi
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Rode pela main: a release sai do commit escolhido, e ele precisa estar na main."
              exit 1
            fi
            printf '%s\n' "$NOTES" > notes.md
          fi
          echo "TAG=$version" >> "$GITHUB_ENV"

      - name: Montar o pacote
        # Só o que a extensão usa: o mesmo conteúdo que vai para a Chrome Web Store.
        run: git archive --format=zip -o "PageClip-$TAG.zip" HEAD manifest.json icons src LICENSE

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "PageClip-$TAG.zip" --clobber
          else
            gh release create "$TAG" "PageClip-$TAG.zip" \
              --title "$TAG" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
